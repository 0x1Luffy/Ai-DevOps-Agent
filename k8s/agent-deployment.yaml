apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-agent
  namespace: autopilot
  labels:
    app: autopilot-agent
    version: "3.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autopilot-agent
  template:
    metadata:
      labels:
        app: autopilot-agent
    spec:
      serviceAccountName: autopilot-agent
      containers:
      - name: agent
        image: your-registry/autopilot-agent:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: autopilot-secrets
        - configMapRef:
            name: autopilot-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: arm64
