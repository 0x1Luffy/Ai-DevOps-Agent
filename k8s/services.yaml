# autopilot-agent — exposed as NodePort so an external Jenkins server can POST
# webhooks to http://<NODE_IP>:30008/webhooks/jenkins
apiVersion: v1
kind: Service
metadata:
  name: autopilot-agent
  namespace: autopilot
  labels:
    app: autopilot-agent
spec:
  selector:
    app: autopilot-agent
  type: NodePort
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30008
---
# autopilot-api — exposed as NodePort so the React dashboard (served from a
# browser) can reach the REST + WebSocket API at http://<NODE_IP>:30010
apiVersion: v1
kind: Service
metadata:
  name: autopilot-api
  namespace: autopilot
  labels:
    app: autopilot-api
spec:
  selector:
    app: autopilot-api
  type: NodePort
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    nodePort: 30010
---
# autopilot-dashboard — exposed as NodePort so you can open the UI in a browser
# at http://<NODE_IP>:30011
apiVersion: v1
kind: Service
metadata:
  name: autopilot-dashboard
  namespace: autopilot
  labels:
    app: autopilot-dashboard
spec:
  selector:
    app: autopilot-dashboard
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30011
