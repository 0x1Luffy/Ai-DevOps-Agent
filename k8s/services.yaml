apiVersion: v1
kind: Service
metadata:
  name: autopilot-agent
  namespace: autopilot
spec:
  selector:
    app: autopilot-agent
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: autopilot-api
  namespace: autopilot
spec:
  selector:
    app: autopilot-api
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: autopilot-dashboard
  namespace: autopilot
spec:
  selector:
    app: autopilot-dashboard
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
