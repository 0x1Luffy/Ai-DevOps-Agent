apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-api
  namespace: autopilot
  labels:
    app: autopilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autopilot-api
  template:
    metadata:
      labels:
        app: autopilot-api
    spec:
      containers:
      - name: api
        image: your-registry/autopilot-api:latest
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: autopilot-secrets
        - configMapRef:
            name: autopilot-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: arm64
