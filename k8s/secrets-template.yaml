# Copy this to secrets.yaml, fill in values, apply with: kubectl apply -f secrets.yaml
# DO NOT commit secrets.yaml to git
apiVersion: v1
kind: Secret
metadata:
  name: autopilot-secrets
  namespace: autopilot
type: Opaque
stringData:
  # Provide the key for whichever LLM_PROVIDER you set in the ConfigMap.
  # Only the selected provider's key is required; the other may be left blank.
  ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY"
  OPENAI_API_KEY: "YOUR_OPENAI_API_KEY"
  DATABASE_URL: "postgresql://autopilot:autopilot@postgres.autopilot.svc.cluster.local:5432/autopilot"
  JENKINS_USER: "admin"
  JENKINS_TOKEN: "YOUR_JENKINS_API_TOKEN"
  JENKINS_WEBHOOK_SECRET: "YOUR_WEBHOOK_SECRET"
  SLACK_BOT_TOKEN: "xoxb-YOUR-BOT-TOKEN"
  SLACK_APP_TOKEN: "xapp-YOUR-APP-LEVEL-TOKEN"
  SLACK_SIGNING_SECRET: "YOUR_SLACK_SIGNING_SECRET"
  GITHUB_TOKEN: "ghp_YOUR_GITHUB_TOKEN"
  GITHUB_REPO: "your-org/your-repo"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your@email.com"
  SMTP_PASS: "YOUR_APP_PASSWORD"
  ESCALATION_EMAIL: "raj@hexaware.com"
  API_KEY: "change-me-to-a-strong-secret"
